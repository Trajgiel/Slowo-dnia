# Build the React app and publish it to GitHub Pages
# (Settings -> Pages -> Source: "GitHub Actions", switched on release day).
#
# - push to main and manual runs on main: build -> check -> upload -> deploy;
# - pull requests (into develop and main): the same build, check and upload,
#   without the deploy job, so the first real deploy is not the first build.
#
# The file hashes in the run summary are what deploy/check-pages.sh "sums"
# compares with the live site after a deploy (ops/runbooks/pages-source.md).
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

# Deploys: one at a time, a running deployment is never cancelled halfway,
# the next one waits in the queue. Pull requests: their own group per PR,
# a newer push to the PR cancels the older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache in the job that produces the published site.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # tsc -b && vite build; the base path /Slowo-dnia/ comes from vite.config.ts.
      - name: Build
        run: npm run build

      # Fails if sw.js, the manifest, icons, fonts with their licences or LICENSE are missing.
      - name: Check build contents
        run: bash deploy/check-dist.sh dist

      - name: List published files
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          {
            echo '### Published files (sha256)'
            echo 'After the deploy: save the lines below to a file and run deploy/check-pages.sh sums FILE.'
            echo '```'
            find . -type f -print0 | sort -z | xargs -0 sha256sum
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    # Deploy only on main and never for a pull request (a PR run only builds and uploads);
    # the github-pages environment also allows main only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
