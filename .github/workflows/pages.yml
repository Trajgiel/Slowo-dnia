# Publish the site to GitHub Pages (Settings -> Pages -> Source: "GitHub Actions").
# Today the site is the static prototype, published as is: no build step,
# the files below are copied byte for byte (sw.js must stay identical so the
# installed app's offline cache "slowo-dnia-v6" is not updated).
# The React build replaces the "Stage site files" step in SD-19.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs.
permissions: {}

# One Pages deployment at a time; a running deployment is never cancelled
# halfway, the next one waits in the queue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage site files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html
            sw.js
            manifest.webmanifest
            courses
            icons
            fonts
            LICENSE
            README.md
            .nojekyll
          )
          mkdir _site
          for f in "${files[@]}"; do
            if [ ! -e "$f" ]; then
              echo "::error::Missing site file: $f"
              exit 1
            fi
            cp -R -- "$f" _site/
          done

      - name: List published files
        shell: bash
        working-directory: _site
        run: |
          set -euo pipefail
          {
            echo '### Published files (sha256)'
            echo '```'
            find . -type f -print0 | sort -z | xargs -0 sha256sum
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          # Needed for .nojekyll; .git and .github are excluded by the action regardless.
          include-hidden-files: true

  deploy:
    needs: build
    # Deploy only from main (a manual run from another branch builds but does not deploy);
    # the github-pages environment also allows main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
